name: dba-prod-backend

services:
  db:
    image: mysql:8.0
    container_name: dba-prod-db
    restart: unless-stopped
    command: ["mysqld", "--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ}
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - internal

  backend:
    image: dba/backend:prod
    container_name: dba-prod-backend
    restart: unless-stopped
    user: "${APP_UID:-1001}:${APP_GID:-1001}"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SERVER_PORT: 8081
      MANAGEMENT_PORT: 8090
      TZ: ${TZ}
      APP_LOG_DIR: ${APP_LOG_DIR:-/app/logs}
    ports:
      - "${BACKEND_PORT:-5281}:8081"
    expose:
      - "8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - ./backend-storage:/opt/dbaalld01_project/deploy-dba_alld_project/backend
      - ./backend-logs:/app/logs
    networks:
      - internal
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.http.routers.dba-backend.rule=Host(`${BACKEND_HOST}`) && PathPrefix(`/dba-alld`)
      - traefik.http.routers.dba-backend.entrypoints=${TRAEFIK_ENTRYPOINT}
      - traefik.http.routers.dba-backend.tls=${TRAEFIK_TLS}
      - traefik.http.services.dba-backend.loadbalancer.server.port=8081
      - traefik.docker.network=traefik-public

networks:
  internal:
    name: dba-prod-internal
  traefik-public:
    external: true
