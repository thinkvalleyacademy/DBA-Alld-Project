version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dba
      MYSQL_USER: rwroot
      MYSQL_PASSWORD: root

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - mysql_test_network

volumes:
  mysql_data:

networks:
  mysql_test_network:
    driver: bridge