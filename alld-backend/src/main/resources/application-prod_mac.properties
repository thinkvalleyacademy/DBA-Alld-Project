spring.application.name=alld
server.port=3081

# ===============================
# = DATA SOURCE CONFIGURATION
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/dba
spring.datasource.username=rwroot
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
#spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# = JPA / HIBERNATE
# ===============================
# Hibernate dialect for MySQL 8.x
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Schema handling
# validate = check schema matches, no changes
# update   = auto update schema
# create   = create schema at startup (drops existing)
# create-drop = drop schema at shutdown
spring.jpa.hibernate.ddl-auto=validate

# Show SQL in logs (disabled for production performance)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===============================
# = CONNECTION POOL (HikariCP)
# ===============================
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# ===============================
# = LOGGING (Optional for debugging)
# ===============================
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Comma-separated list of allowed origins (configured via environment variable)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://dbaalld.thinkvalleysoftwares.in,https://dbaalld.org,https://localhost:4000}
app.cors.enabled=${CORS_ENABLED:true}

# s3Bucket Setup
aws.s3.bucket.name=amazn-s3-dbaalld
aws.access-key=${AWS_ACCESS_KEY_ID}
aws.secret-key=${AWS_SECRET_ACCESS_KEY}
aws.region=ap-south-1

app.upload.base-path=/home/dbadev01/app-deployment-prod/backend/
media.base-url=${MEDIA_BASE_URL:https://103.29.62.25:4082}
app.log.dir=${APP_LOG_DIR:/app/logs}

# Metrics/monitoring (Prometheus + Grafana)
# Use separate management port to avoid conflicts with application APIs
management.server.port=8090
management.server.address=0.0.0.0
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoints.web.base-path=/actuator
management.prometheus.metrics.export.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}

#Google re-CAPTCHA
recaptcha.secret-key=${RECAPTCHA_SECRET_KEY:6LfXhYEsAAAAACaV-ufthOMNP-lf1j1nDJXAwyi9}
recaptcha.verify-url=${RECAPTCHA_VERIFY_URL:https://www.google.com/recaptcha/api/siteverify}
recaptcha.fail-fast-on-missing-secret=${RECAPTCHA_FAIL_FAST:true}

jwt.secret=${JWT_SECRET}