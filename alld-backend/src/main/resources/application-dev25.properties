spring.application.name=alld


# ===============================
# = DATA SOURCE CONFIGURATION
# ===============================
spring.datasource.url=jdbc:mysql://103.29.62.25:3306/dba
spring.datasource.username=rwroot
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
#spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# = JPA / HIBERNATE
# ===============================
# Hibernate dialect for MySQL 8.x
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Schema handling
# validate = check schema matches, no changes
# update   = auto update schema
# create   = create schema at startup (drops existing)
# create-drop = drop schema at shutdown
spring.jpa.hibernate.ddl-auto=validate

# Show SQL in logs
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# = CONNECTION POOL (HikariCP)
# ===============================
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# ===============================
# = LOGGING (Optional for debugging)
# ===============================
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# ===============================
# = CORS Configuration
# ===============================
cors.config.ip=http://103.29.62.25:4080

# File upload directory for member images/files
member.upload-dir=/home/aakash/uploads/members

media.base-url=https://103.29.62.25:4082
media.secret=CHANGE_THIS_TO_LONG_RANDOM_SECRET
