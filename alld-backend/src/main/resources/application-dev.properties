spring.application.name=alld

# ===============================
# = DATA SOURCE CONFIGURATION
# ===============================
spring.datasource.url=jdbc:mysql://db:3306/dba
spring.datasource.username=rwroot
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# = JPA / HIBERNATE
# ===============================
# Hibernate dialect for MySQL 8.x
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Schema handling
# validate = check schema matches, no changes
# update   = auto update schema
# create   = create schema at startup (drops existing)
# create-drop = drop schema at shutdown
spring.jpa.hibernate.ddl-auto=validate

# Show SQL in logs for dev debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# = CONNECTION POOL (HikariCP)
# ===============================
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# ===============================
# = LOGGING (Optional for debugging)
# ===============================
app.log.dir=${APP_LOG_DIR:./backend-logs}
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Comma-separated list of allowed origins
app.cors.allowed-origins=https://dev.thinkvalleysoftwares.in,https://103.29.62.25:5082,http://localhost:4000
app.cors.enabled=true

# Where files actually live (OLD + NEW)
app.upload.base-path=/home/dbadev01/app-deployment-dev/backend/
media.base-url=https://103.29.62.25:4082
s3.enabled=${S3_ENABLED:true}

spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
app.log.dir=${APP_LOG_DIR:/app/logs}

# s3Bucket Setup (non-prod)
aws.s3.bucket.name=amazn-s3-dbaalld-dev

# Metrics/monitoring (Prometheus + Grafana) - inherited from application.properties but explicitly set here for clarity
# Use separate management port to avoid conflicts with application APIs
management.server.port=8090
management.server.address=0.0.0.0
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoints.web.base-path=/actuator
management.prometheus.metrics.export.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}

