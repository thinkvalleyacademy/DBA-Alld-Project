spring.application.name=alld

# ===============================
# = DATA SOURCE CONFIGURATION
# ===============================
# Local environment - Port 4306 (4xxx series)
spring.datasource.url=jdbc:mysql://localhost:4306/dba
spring.datasource.username=rwroot
spring.datasource.password=${DB_PASSWORD:root}
#spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# = JPA / HIBERNATE
# ===============================
# Hibernate dialect for MySQL 8.x
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Schema handling
# validate = check schema matches, no changes
# update   = auto update schema
# create   = create schema at startup (drops existing)
# create-drop = drop schema at shutdown
spring.jpa.hibernate.ddl-auto=update

# Show SQL in logs
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===============================
# = CONNECTION POOL (HikariCP)
# ===============================
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
# ===============================
# = LOGGING (Optional for debugging)
# ===============================
app.log.dir=${APP_LOG_DIR:./backend-logs}
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# ===============================
# = CORS Configuration
# ===============================
# Comma-separated list of allowed origins
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:4080,http://103.29.62.25:4080
app.cors.enabled=true

app.upload.base-path=/opt/dbaalld01_project/deploy-dba_alld_project/backend/
media.base-url=https://103.29.62.25:4082

# s3Bucket Setup (non-prod)
aws.s3.bucket.name=amazn-s3-dbaalld-dev

