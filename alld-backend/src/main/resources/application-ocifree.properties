spring.application.name=alld

# ===============================
# = ROOT-LEVEL DEPLOYMENT
# App is the only thing served by this instance, so it lives at "/"
# instead of the "/dba-alld" context-path the other environments use
# (they need it for nginx's routing between separate frontend/backend
# containers -- not applicable here since frontend+backend are one app).
# ===============================
server.servlet.context-path=

# ===============================
# = DATA SOURCE CONFIGURATION
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# = JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===============================
# = CONNECTION POOL (HikariCP)
# Small pool -- single tiny instance, low traffic
# ===============================
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-timeout=30000

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===============================
# = LOGGING
# ===============================
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# ===============================
# = CORS -- not needed, frontend is served same-origin from this app
# ===============================
app.cors.enabled=false

# S3-compatible object storage (OCI Object Storage) -- optional, dual-write
# alongside local disk (see S3Service). Disabled by default; set S3_ENABLED=true
# plus the other AWS_* / AWS_S3_* env vars once the bucket exists.
aws.s3.bucket.name=${AWS_S3_BUCKET:unused}
aws.region=${AWS_REGION:ap-south-1}
aws.s3.endpoint=${AWS_S3_ENDPOINT:}
s3.enabled=${S3_ENABLED:false}

app.upload.base-path=${FILE_STORAGE_PATH}
app.log.dir=${APP_LOG_DIR:/app/logs}

# Actuator on the same port as the app (no separate management port --
# one less embedded connector on a memory-constrained instance)
management.endpoints.web.exposure.include=health,info
management.endpoints.web.base-path=/actuator

