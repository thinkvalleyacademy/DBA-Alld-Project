spring.application.name=alld
server.address=0.0.0.0

#spring.profiles.active=local
server.port=${SERVER_PORT}
server.servlet.context-path=/dba-alld

# ===============================
# = PERFORMANCE TUNING
# ===============================
# Disable Open-in-View to prevent lazy loading issues and improve performance
spring.jpa.open-in-view=false

# Enable lazy loading by default
spring.jpa.properties.hibernate.lazy_load_by_default=true

# HikariCP connection pool optimization
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=60000

# ===============================
# = SCHEDULER CONFIGURATION
# ===============================
my.scheduler.enabled=true
my.scheduler.cron=0 0 2 * * *

# ===============================
# = CORS CONFIGURATION
# ===============================
app.cors.enabled=true
spring.cache.type=caffeine

# ===============================
# = CAFFEINE CACHE CONFIGURATION
# ===============================
# Maximum number of entries in cache
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=1h

# ===============================
# = JWT CONFIGURATION
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
jwt.refresh-expiration=604800000

# ===============================
# = TOKEN BLACKLIST CONFIGURATION
# ===============================
# Enable/disable token blacklist cleanup scheduler
token.blacklist.cleanup.enabled=true
# Cron expression for cleanup job (daily at 2:00 AM)
token.blacklist.cleanup.cron=0 0 2 * * ?

# ===============================
# = FILE UPLOAD CONFIGURATION
# ===============================
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# ===============================
# = AWS S3 CONFIGURATION
# ===============================
aws.access-key=${AWS_ACCESS_KEY_ID}
aws.secret-key=${AWS_SECRET_ACCESS_KEY}
aws.region=ap-south-1

#Google re-CAPTCHA
recaptcha.secret-key=${RECAPTCHA_SECRET_KEY}
recaptcha.verify-url=https://www.google.com/recaptcha/api/siteverify

s3.enabled=false
